<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IEEE SB GEC Palakkad — Redirecting…</title>
    <script>
      // Single-Page App redirect for GitHub Pages.
      // Encodes the intended path into the query string so GitHub's 404 handler
      // can serve index.html, which then decodes and navigates to the real route.
      // Based on: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 0; // 0 for custom domain, 1 for org.github.io/repo-name
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
